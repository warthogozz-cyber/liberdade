# No issuer-uri: Boot's built-in Google provider applies, so tests never touch the network.
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
# Unsupported-method tests are expected; keep their WARN out of the test output.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
# OpenApiDriftIT and OpenApiContractIT read the contract.
springdoc.api-docs.enabled=true
# Billing runs on the fake gateway here; the prod profile refuses it. Test values, not secrets.
liberdade.billing.gateway=fake
liberdade.billing.enabled=true
liberdade.billing.presale-open=true
liberdade.billing.checkout-hosts=checkout.e2e.test
liberdade.billing.webhook-token=test-webhook-token-0123456789abcdef0123
# The tests call the jobs' run() directly; the hourly billing retry must not race them.
liberdade.scheduling.enabled=false
