# No issuer-uri: Boot's built-in Google provider applies, so tests never touch the network.
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
# Unsupported-method tests are expected; keep their WARN out of the test output.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
