# API inside Docker against the test sign-in provider from compose.e2e.yaml. Test values, not secrets.
spring.security.oauth2.client.registration.google.client-id=liberdade-e2e
spring.security.oauth2.client.registration.google.client-secret=e2e-secret
# The API reaches the provider by its service name; the browser reaches it through the published port.
spring.security.oauth2.client.provider.google.issuer-uri=http://mock-oauth2:8090/google
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:8090/google/authorize
