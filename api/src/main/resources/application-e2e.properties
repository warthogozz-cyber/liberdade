# API inside Docker against the test sign-in provider from compose.e2e.yaml. Test values, not secrets.
spring.security.oauth2.client.registration.google.client-id=liberdade-e2e
spring.security.oauth2.client.registration.google.client-secret=e2e-secret
# The API reaches the provider by its service name; the browser reaches it through the published port.
# By IP, not "localhost": the API over HTTPS sends HSTS, and WebKit then upgrades every
# http://localhost URL, this plain-HTTP provider included. HSTS never applies to an IP address.
spring.security.oauth2.client.provider.google.issuer-uri=http://mock-oauth2:8090/google
spring.security.oauth2.client.provider.google.authorization-uri=http://127.0.0.1:8090/google/authorize
# Billing runs on the fake gateway here; the prod profile refuses it. Test values, not secrets.
liberdade.billing.gateway=fake
liberdade.billing.enabled=true
liberdade.billing.presale-open=true
liberdade.billing.checkout-hosts=checkout.e2e.test
liberdade.billing.webhook-token=test-webhook-token-0123456789abcdef0123
# Indicators come from fixed values here; the prod profile refuses them.
liberdade.indicators.source=fake
liberdade.markets.osm.source=fake
liberdade.markets.geocoding.source=fake
liberdade.markets.geocoding.min-interval=0s
liberdade.markets.instagram.source=fake
# HTTPS with the local test certificate (web/scripts/e2e-cert.mjs), mounted by compose.e2e.yaml: WebKit
# refuses the Secure session cookie on plain http://localhost. The app is served over HTTPS too.
liberdade.web.origin=https://localhost:5173
server.ssl.certificate=file:/certs/cert.pem
server.ssl.certificate-private-key=file:/certs/key.pem
# Health stays on plain HTTP on its own port, for the Compose healthcheck and the suite's readiness wait.
management.server.port=8081
management.server.ssl.enabled=false
