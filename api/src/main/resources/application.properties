spring.application.name=liberdade-api
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-stacktrace=never
server.error.include-message=never
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
liberdade.web.origin=${WEB_ORIGIN:http://localhost:5173}
liberdade.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
liberdade.webauthn.rp-name=Liberdade
# The session cookie (__Host-sid) is set in SecurityConfig: server.servlet.session.* is ignored under MockMvc.
# Sessions start short; SecurityConfig raises a signed-in session to 30 days (SIGNED_IN_IDLE_TIMEOUT).
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
# The OpenAPI contract (D32): served only by the dev and test profiles, in OpenAPI 3.0, with sorted keys so it is
# the same on every machine. Only the /v1 routes, without the error responses of the @ControllerAdvice.
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/v1/**
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
# Billing (D4): each key is bound explicitly, because relaxed binding turns LIBERDADE_BILLING_ASAAS_BASE_URL into
# asaas.base.url. The defaults are the safe ones: nothing on sale.
liberdade.billing.gateway=asaas
liberdade.billing.enabled=${LIBERDADE_BILLING_ENABLED:false}
liberdade.billing.presale-open=${LIBERDADE_BILLING_PRESALE_OPEN:false}
liberdade.billing.asaas.base-url=${LIBERDADE_BILLING_ASAAS_BASE_URL:https://api-sandbox.asaas.com}
liberdade.billing.asaas.api-key=${ASAAS_API_KEY:}
liberdade.billing.checkout-hosts=${LIBERDADE_BILLING_CHECKOUT_HOSTS:sandbox.asaas.com}
liberdade.billing.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
# Live sync (D1): streams per person and per process, how often they are checked and how long one lives
liberdade.live.max-per-person=5
liberdade.live.max-streams=1000
liberdade.live.heartbeat=25s
liberdade.live.stream-timeout=30m
# Indicators (D2): the Banco Central by default; dev, e2e and test use the fake source, and prod refuses it.
liberdade.indicators.source=bcb
liberdade.indicators.sgs-base-url=https://api.bcb.gov.br
liberdade.indicators.ptax-base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1
liberdade.indicators.bot-url=${liberdade.web.origin}/robo
liberdade.indicators.timeout=10s
liberdade.indicators.retry-waits=2s,8s
liberdade.indicators.pause-between-series=1s
