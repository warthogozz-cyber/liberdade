# Local run (bootTestRun) against the test sign-in provider from compose.e2e.yaml. Test values, not secrets.
spring.security.oauth2.client.registration.google.client-id=liberdade-e2e
spring.security.oauth2.client.registration.google.client-secret=e2e-secret
spring.security.oauth2.client.provider.google.issuer-uri=http://localhost:8090/google
springdoc.api-docs.enabled=true
# Billing runs on the fake gateway here; the prod profile refuses it. Test values, not secrets.
liberdade.billing.gateway=fake
liberdade.billing.enabled=true
liberdade.billing.presale-open=true
liberdade.billing.checkout-hosts=checkout.e2e.test
# Indicators come from fixed values here; the prod profile refuses them.
liberdade.indicators.source=fake
liberdade.markets.osm.source=fake
liberdade.markets.geocoding.source=fake
liberdade.markets.geocoding.min-interval=0s
liberdade.markets.instagram.source=fake
