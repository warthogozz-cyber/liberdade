# Production behind Caddy in Docker Compose (D8, D9, D11).
# Tomcat itself applies X-Forwarded-For and X-Forwarded-Proto, and only when the peer is the compose network, so a
# client cannot forge its address for the rate limiter or fake https for HSTS.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=172.30.0.0/24
# One JSON line per log event.
logging.structured.format.console=ecs
spring.datasource.hikari.maximum-pool-size=5
