# Host stack (D6, D8, D9, D11): Caddy in front of the staging and production APIs, all on one EC2 instance.
# deploy.sh copies this file and the Caddyfile to /opt/liberdade and reads PRODUCTION_TAG and STAGING_TAG
# (and nothing else) from /opt/liberdade/tags.env. Every file here is host-wide: a change applies on the
# next deploy of either environment, which is why CI validates it.
name: liberdade

x-api: &api
  restart: unless-stopped
  mem_limit: 768m
  networks:
    - liberdade
  volumes:
    - /certs/rds-bundle.pem:/certs/rds-bundle.pem:ro
  healthcheck:
    # The JRE image has no curl/wget, so use bash's /dev/tcp (same check as the root compose.yaml).
    test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/localhost/8080 &&
        printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
        grep -q '"status":"UP"' <&3
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 30s

services:
  caddy:
    # Multi-arch index digest (works on the arm64 host and on amd64 CI runners).
    # arm64 manifest: sha256:cc447f149425221422153c6cdf33a123b3f458839679f950298f68a690a54a5b
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - liberdade
    logging:
      driver: awslogs
      options:
        awslogs-region: sa-east-1
        awslogs-group: /liberdade/caddy
        awslogs-stream: caddy
        mode: non-blocking
        max-buffer-size: 4m

  api-production:
    <<: *api
    image: ${API_IMAGE:-ghcr.io/warthogozz-cyber/liberdade-api}:${PRODUCTION_TAG:-unset}
    # deploy.sh writes this file from SSM before it starts the service. required: false only lets
    # `compose config` run in step 2 of deploy.sh, before the file exists.
    env_file:
      - path: /run/liberdade/production.env
        required: false
    environment:
      # The prod profile turns on the trusted-proxy handling that the rate limiter and HSTS rely on.
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: awslogs
      options:
        awslogs-region: sa-east-1
        awslogs-group: /liberdade/production
        awslogs-stream: api-production
        mode: non-blocking
        max-buffer-size: 4m

  api-staging:
    <<: *api
    image: ${API_IMAGE:-ghcr.io/warthogozz-cyber/liberdade-api}:${STAGING_TAG:-unset}
    env_file:
      - path: /run/liberdade/staging.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: awslogs
      options:
        awslogs-region: sa-east-1
        awslogs-group: /liberdade/staging
        awslogs-stream: api-staging
        mode: non-blocking
        max-buffer-size: 4m

networks:
  liberdade:
    ipam:
      config:
        # Must equal server.tomcat.remoteip.internal-proxies in application-prod.properties (CI checks it).
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
