# Extra Compose file for deploy-test.sh: no awslogs, no RDS bundle, a local Postgres and an env file
# that the test writes (CI_ENV_FILE). Test values only.
services:
  db:
    # Multi-arch index digest of postgres:18. arm64 manifest: sha256:ede0133b5b300f7609629c2bd8ac2cf8cbaf830527200ea2cbecf80f4481f2d3
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: liberdade
      POSTGRES_USER: liberdade
      POSTGRES_PASSWORD: ci-only
    networks:
      - liberdade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberdade -d liberdade"]
      interval: 3s
      retries: 20

  api-production:
    env_file: !override
      - ${CI_ENV_FILE:?}
    volumes: !override []
    logging: !override
      driver: json-file

  api-staging:
    env_file: !override
      - ${CI_ENV_FILE:?}
    volumes: !override []
    logging: !override
      driver: json-file

  caddy:
    logging: !override
      driver: json-file
