packages:
  - web
allowBuilds:
  esbuild: true
  msw: false
  workerd: true
minimumReleaseAge: 10080
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
# Supply-chain cutoff of 2026-10-26: msw's transitive packages pinned to the newest versions
# published on or before it. Remove this block when the cutoff moves.
overrides:
  '@inquirer/ansi': 2.0.9
  '@inquirer/confirm': 6.3.4
  '@inquirer/core': 12.0.5
  '@inquirer/figures': 2.0.9
  '@mswjs/interceptors': 0.45.9
  # The same cutoff for the transitive packages of vite-plugin-pwa and workbox-build.
  '@babel/generator': 7.29.8
  '@babel/helper-create-class-features-plugin': 7.29.7
  '@babel/helper-skip-transparent-expression-wrappers': 7.29.7
  '@babel/parser': 7.29.11
  '@babel/plugin-bugfix-safari-rest-destructuring-rhs-array': 7.29.7
  '@babel/plugin-transform-block-scoping': 7.29.11
  '@babel/plugin-transform-destructuring': 7.29.7
  '@babel/plugin-transform-for-of': 7.29.7
  '@babel/traverse': 7.29.10
  '@types/estree': 1.0.9
  is-core-module: 2.17.0
  regexpu-core: 6.5.3
  regjsparser: 0.13.4
  resolve: 1.22.13
  rollup: 4.65.1
  # The one exception to the cutoff, approved by the maintainer: workbox-build's glob 11 has
  # GHSA-3g3m-2fjr-6pw4 (moderate), fixed first in 14.0.2, published on 2026-10-27. workbox-build
  # only calls globSync, whose API is the same in glob 14. Its new dependencies are pinned to
  # versions also published on 2026-10-27, so the exception covers one day.
  glob: 14.0.2
  'glob>minimatch': 11.0.1
  '@isaacs/nonrecursive-glob-match': 1.0.1
  # The same approved minimatch for eslint's copies: GHSA-g3hv-75wg-m249 (high) affects every
  # minimatch from 7.0.0 to 11.0.0 and is fixed only in 11. Lint-time only; no new package.
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
