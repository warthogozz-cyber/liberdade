name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  api:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test
        working-directory: api
        run: ./gradlew build
      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: api/build/reports/jacoco/
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check generated API types
        run: |
          pnpm --filter web gen:api
          git diff --exit-code -- web/src/shared/api/schema.ts
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test:coverage
      - run: pnpm --filter web build
      - run: pnpm --filter web check:chunks
      - name: Upload web coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start the API with the test provider
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait
      - run: pnpm --filter web e2e
      - name: Save Compose logs
        if: ${{ failure() }}
        run: |
          mkdir -p web/test-results
          docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color > web/test-results/compose.log
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - name: Stop Compose
        if: ${{ always() }}
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, Unlicense, CC0-1.0,
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, MPL-2.0,
            GPL-3.0-only, GPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            CC-BY-4.0, OFL-1.1, Python-2.0,
            EPL-1.0, EPL-2.0
          # Declared MIT on npm, with MIT as its only license file. The scan also reports the Unicode
          # data license for its tables from the Unicode Character Database, which is permissive.
          # It comes in through workbox-build and runs only at build time.
          allow-dependencies-licenses: pkg:npm/unicode-match-property-value-ecmascript@2.2.1

  deploy-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Multi-arch index digests. arm64 manifests: actionlint sha256:33ffa3f1ad576165ea9c26f726884defdc411fb1fcb9ccc6a117b2f554ba1723,
      # shellcheck sha256:4d7c931ae7ee555483ceac75379369f1bc5f01807be6638d12ede9ce29a27b53.
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" "$SHELLCHECK_IMAGE" deploy/*.sh deploy/test/*.sh
      - name: Compose file
        run: docker compose -f deploy/compose.yaml --env-file deploy/tags.env.example config -q
      - name: Compose subnet matches the trusted proxy range
        run: |
          subnet="$(grep -oE 'subnet: *[0-9./]+' deploy/compose.yaml | head -n 1 | sed -E 's/subnet: *//')"
          proxies="$(grep -E '^server\.tomcat\.remoteip\.internal-proxies=' api/src/main/resources/application-prod.properties | cut -d= -f2-)"
          if [ -z "$subnet" ] || [ "$subnet" != "$proxies" ]; then
            echo "::error::Compose subnet '$subnet' differs from server.tomcat.remoteip.internal-proxies '$proxies'"
            exit 1
          fi
      - name: Caddyfile
        run: |
          image="$(grep -oE 'caddy:[^ ]+@sha256:[0-9a-f]{64}' deploy/compose.yaml | head -n 1)"
          test -n "$image"
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -t liberdade-api-ci:local api
      - name: Deploy and roll back
        run: bash deploy/test/deploy-test.sh liberdade-api-ci:local
