name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (staging or production)
        type: string
        required: true
      ref:
        description: Commit SHA to deploy (a tag is also accepted when run by hand)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: Commit SHA or tag to deploy
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The deploy role can run a root shell on the host, so no npm or wrangler code runs in this job's
  # sibling `web` while AWS credentials exist: they live only in `api`.
  api:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      IMAGE: ghcr.io/warthogozz-cyber/liberdade-api
    steps:
      - name: Validate the environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            staging | production) ;;
            *)
              echo "environment must be exactly staging or production" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve the commit
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref did not resolve to a 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Wait for the image
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # The image is built by the main workflow; it may still be building. Up to 30 minutes.
          for _ in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE:sha-$SHA" > /dev/null 2>&1; then
              echo "image sha-$SHA found"
              exit 0
            fi
            echo "waiting for image sha-$SHA"
            sleep 30
          done
          echo "image sha-$SHA missing or not public" >&2
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
          role-duration-seconds: 3600
      - name: Deploy the API over SSM
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TARGET_ENV: ${{ inputs.environment }}
          REPO: ${{ github.repository }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [ -n "$EC2_INSTANCE_ID" ] || { echo "EC2_INSTANCE_ID is empty" >&2; exit 1; }
          params="$RUNNER_TEMP/ssm-params.json"
          # Values reach the host script only as shell-quoted assignments built by jq.
          jq -n --arg repo "$REPO" --arg sha "$SHA" --arg env "$TARGET_ENV" '{
            commands: [
              "set -euo pipefail",
              "REPO=\($repo | @sh)",
              "SHA=\($sha | @sh)",
              "TARGET_ENV=\($env | @sh)",
              "dir=/opt/liberdade/releases/$SHA",
              "mkdir -p \"$dir\"",
              "for f in deploy.sh compose.yaml Caddyfile; do curl -fsSL \"https://raw.githubusercontent.com/$REPO/$SHA/deploy/$f\" -o \"$dir/$f\"; done",
              "bash \"$dir/deploy.sh\" \"$TARGET_ENV\" \"sha-$SHA\" \"$dir\""
            ],
            executionTimeout: ["900"]
          }' > "$params"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TARGET_ENV sha-$SHA" \
            --timeout-seconds 120 \
            --parameters "file://$params" \
            --query Command.CommandId --output text)"
          echo "command $command_id sent"
          # 120 s delivery + 900 s execution + 60 s margin, so SSM reports TimedOut itself.
          deadline=$((SECONDS + 1080))
          status=Pending
          last_error=
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 10
            if out="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>&1)"; then
              status="$out"
              last_error=
            elif printf '%s' "$out" | grep -q 'InvocationDoesNotExist'; then
              # Normal right after the send.
              status=Pending
              last_error="$out"
            else
              echo "get-command-invocation failed: $out" >&2
              exit 1
            fi
            case "$status" in
              Pending | InProgress | Delayed | Cancelling) ;;
              *) break ;;
            esac
          done
          echo "final status: $status"
          if [ -n "$last_error" ]; then
            echo "last error: $last_error" >&2
          fi
          echo "----- standard output -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- standard error -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          if [ "$status" != "Success" ]; then
            echo "deploy did not succeed (status $status)" >&2
            exit 1
          fi
  web:
    needs: api
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.api.outputs.sha }}
          persist-credentials: false
      - name: Check the configuration
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          set -euo pipefail
          for name in API_URL WEB_URL CLOUDFLARE_ACCOUNT_ID PAGES_PROJECT; do
            [ -n "${!name}" ] || { echo "$name is empty for this environment" >&2; exit 1; }
          done
          printf '%s' "$PAGES_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{0,57}$' || {
            echo "PAGES_PROJECT is not a valid Pages project name" >&2
            exit 1
          }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_PRIVACY_CONTROLLER: ${{ vars.PRIVACY_CONTROLLER }}
          VITE_PRIVACY_CONTROLLER_DOCUMENT: ${{ vars.PRIVACY_CONTROLLER_DOCUMENT }}
          VITE_PRIVACY_CONTROLLER_ADDRESS: ${{ vars.PRIVACY_CONTROLLER_ADDRESS }}
          VITE_PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
        run: |
          set -euo pipefail
          pnpm --filter web build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: web
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main
      - name: Smoke test
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: bash deploy/smoke.sh "$API_URL" "$WEB_URL"
