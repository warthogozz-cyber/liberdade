version: 2
updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    ignore:
      # openapi-typescript (web gen:api) breaks on TypeScript 7; lift once it supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep the Node types on the runtime major in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /api
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  # TestcontainersConfiguration.java pins postgres:18 by hand; keep it in sync with compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
