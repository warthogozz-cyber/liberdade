name: Sugerir uma melhoria
description: Uma ideia para o Liberdade
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
      description: Explique a dificuldade que você enfrenta hoje.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina que isso funcione?
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: RF relacionado
      description: Requisito funcional do PRD ligado a esta ideia, se houver.
      placeholder: RF-02
    validations:
      required: false
